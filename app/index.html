<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src ws: wss: http: https: data: blob:; img-src 'self' data: blob: http: https:; style-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream: http: https:; frame-src 'self' http: https: https://www.youtube.com https://www.youtube-nocookie.com; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:">
<title>EpicKast</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="appSplash">
  <div class="splash-content">
    <div class="splash-logo-wrap">
      <img src="logo.svg" alt="EK" class="splash-logo">
      <div class="splash-ring"></div>
      <div class="splash-ring ring2"></div>
    </div>
    <div class="splash-title">Epic<span>Kast</span></div>
    <div class="splash-sub">Ultra-Low Latency Communication</div>
    <div class="splash-loader"><div class="splash-loader-bar"></div></div>
  </div>
</div>
<div id="winBar">
  <div class="win-drag">
    <img src="logo.svg" alt="EK" class="win-logo">
    <span class="win-title">EpicKast</span>
  </div>
  <div class="win-ctrls">
    <button type="button" id="winMin" title="Minimizar">—</button>
    <button type="button" id="winMax" title="Maximizar / Restaurar">▢</button>
    <button type="button" id="winClose" title="Cerrar a segundo plano">✕</button>
  </div>
</div>

<div id="login" class="screen">
  <form id="loginForm" class="card">
    <div class="brand">
      <img src="logo.svg" alt="EK" class="brand-logo">
      <h1>Epic<span>Kast</span></h1>
      <p class="subbrand">Comunicación ultraligera de baja latencia</p>
    </div>
    <label>Servidor<input id="lgServer" placeholder="wss://epickast-b9fd.onrender.com" autocomplete="off"></label>
    <label>Usuario<input id="lgUser" autocomplete="username"></label>
    <label>Contraseña
      <div class="pass-wrap">
        <input id="lgPass" type="password" autocomplete="current-password">
        <button type="button" id="bTogglePass" class="eye-btn" title="Mostrar / ocultar contraseña">
          <svg id="eyeIco" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </label>
    <label class="chk-row"><input id="lgRemember" type="checkbox" checked><span>Permanecer conectado al iniciar la aplicación</span></label>
    <div class="row"><button type="submit" data-mode="login" class="primary">Entrar</button><button type="submit" data-mode="register">Crear cuenta</button></div>
    <p id="lgError" class="err"></p>
  </form>
</div>

<div id="main" class="hidden">
  <nav id="rail"></nav>
  <aside id="side">
    <header id="sideTitle"></header>
    <div id="sideList"></div>
    <div id="voiceDock" class="hidden">
      <div class="vtop">
        <div class="vstatus">
          <div id="voiceInfo"></div>
          <div class="vmeta">
            <span id="pingBadge" class="ping" title="Latencia y calidad de señal P2P"></span>
          </div>
        </div>
        <div class="vquick">
          <button id="bMute" class="qbtn" title="Silenciar / activar micrófono (Alt+M)"><i></i><span>Micro</span></button>
          <button id="bDeaf" class="qbtn" title="Silenciar audio de la llamada (Alt+D)"><i></i><span>Audio</span></button>
          <button id="bDockMore" class="qbtn" title="Desplegar más controles de llamada"><i></i></button>
          <button id="bLeave" class="qbtn hang" title="Colgar llamada"><i></i><span>Colgar</span></button>
        </div>
      </div>
      <div class="micbar" title="Nivel de tu micrófono en vivo (la puerta anti-respiración filtra ruidos)"><div id="micLive"></div></div>
      <div id="dockDrawer" class="dock hidden">
        <button id="bCam" class="dockbtn" title="Encender / apagar cámara"><i></i><span>Cámara</span></button>
        <button id="bScreen" class="dockbtn" title="Compartir pantalla"><i></i><span>Pantalla</span></button>
        <button id="bSoundboard" class="dockbtn" title="Tablero de Sonidos (Soundboard para llamadas)"><i></i><span>Sonidos</span></button>
        <button id="bGameMode" class="dockbtn" title="Modo Juego: Optimizar ping y rendimiento para jugar"><i></i><span>Juegos</span></button>
        <button id="bOverlay" class="dockbtn" title="Superposición de voz gamer (Overlay transparente sobre juegos)"><i></i><span>Overlay</span></button>
        <button id="bLoop" class="dockbtn" title="Escuchar mi propio micrófono (para probar cómo sueno)"><i></i><span>Oírme</span></button>
        <button id="bMinigame" class="dockbtn" title="Minijuego Multijugador: EpicStrike 2D & Cajas Tácticas"><i></i><span>Minijuego</span></button>
        <button id="bMini" class="dockbtn" title="Modo ventana sobre ventana (siempre visible encima)"><i></i><span>Flotante</span></button>
      </div>
    </div>
    <footer id="meBar"></footer>
  </aside>
  <section id="center">
    <div id="updateBar" class="hidden"></div>
    <header id="chTitle"></header>
    <div id="stageWrap" class="hidden">
      <div id="stage"></div>
      <div id="meetBar">
        <button id="mMute" class="mbtn" title="Silenciar / activar micrófono (Alt+M)"></button>
        <button id="mDeaf" class="mbtn" title="Silenciar audio (Alt+D)"></button>
        <button id="mCam" class="mbtn" title="Encender / apagar cámara"></button>
        <button id="mScreen" class="mbtn" title="Compartir pantalla o ventana"></button>
        <div class="mmore-wrap">
          <button id="mMore" class="mbtn" title="Opciones avanzadas, vista, música y utilidades"></button>
          <div id="meetMenu" class="meet-menu hidden"></div>
        </div>
        <button id="mLeave" class="mbtn hang" title="Colgar llamada"><span id="mLeaveIco"></span><span>Colgar</span></button>
      </div>
      <div id="stageResizer" title="Haz clic para alternar tamaños (S/M/L/XL) o arrastra hacia arriba/abajo"><span></span></div>
    </div>
    <div id="voicePill" class="voice-pill hidden">
      <div class="vpill-left">
        <span class="vpill-dot"></span>
        <span id="vpillTitle" class="vpill-title">Llamada de voz</span>
        <span id="vpillInfo" class="vpill-info">En llamada</span>
      </div>
      <div class="vpill-acts">
        <button type="button" id="vpillExpand" class="vpill-btn" title="Mostrar cámaras / escenario de video">📹 Mostrar cámaras</button>
        <button type="button" id="vpillMute" class="vpill-btn" title="Silenciar / activar micro">Micro</button>
        <button type="button" id="vpillDeaf" class="vpill-btn" title="Silenciar audio">Audio</button>
        <button type="button" id="vpillHang" class="vpill-btn vpill-hang" title="Colgar llamada">Colgar</button>
      </div>
    </div>
    <div id="msgs"></div>
    <div id="typingBar" class="hidden"></div>
    <div id="replyBar" class="hidden"></div>
    <form id="composer">
      <button type="button" id="bAttach" title="Enviar imagen o documento (también puedes arrastrar o pegar con Ctrl+V)">📎</button>
      <button type="button" id="bVoiceNote" title="Grabar nota de voz rápida (clic para grabar, clic de nuevo para enviar)">🎙️</button>
      <input id="fileInput" type="file" multiple class="hidden">
      <input id="msgInput" placeholder="Escribe un mensaje, pega una captura (Ctrl+V) o arrastra archivos…" autocomplete="off" maxlength="2000">
    </form>
    <div id="home" class="hidden"></div>
  </section>
  <aside id="members"></aside>
</div>

<button id="bMiniExit" title="Volver a ventana normal">⤢</button>
<div id="callOverlay" class="hidden"></div>
<div id="modal" class="hidden"></div>
<div id="toast"></div>
<script src="call.js"></script>
<script src="game.js"></script>
<script src="renderer.js"></script>
</body>
</html>
