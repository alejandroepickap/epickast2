<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="snowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#bae6fd"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="sGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#081420" stroke="#38bdf8" stroke-width="2.5" filter="url(#sGlow)"/>
  <!-- Crystalline Snowflake Emblem -->
  <g stroke="url(#snowGlow)" stroke-width="3" stroke-linecap="round">
    <!-- Main Axes -->
    <line x1="50" y1="16" x2="50" y2="84"/>
    <line x1="20" y1="33" x2="80" y2="67"/>
    <line x1="20" y1="67" x2="80" y2="33"/>
    <!-- Crystal Chevrons -->
    <!-- Top -->
    <path d="M44 26 L50 20 L56 26" fill="none"/>
    <path d="M42 36 L50 30 L58 36" fill="none"/>
    <!-- Bottom -->
    <path d="M44 74 L50 80 L56 74" fill="none"/>
    <path d="M42 64 L50 70 L58 64" fill="none"/>
    <!-- Top-Right -->
    <path d="M68 28 L74 34 L68 40" fill="none"/>
    <!-- Bottom-Left -->
    <path d="M32 60 L26 66 L32 72" fill="none"/>
    <!-- Bottom-Right -->
    <path d="M68 60 L74 66 L80 60" fill="none"/>
    <!-- Top-Left -->
    <path d="M32 40 L26 34 L32 28" fill="none"/>
  </g>
  <!-- Center Diamond -->
  <polygon points="50,42 58,50 50,58 42,50" fill="#ffffff" filter="url(#sGlow)"/>
  <!-- Shards -->
  <circle cx="50" cy="12" r="2" fill="#e0f2fe"/>
  <circle cx="84" cy="50" r="2" fill="#e0f2fe"/>
  <circle cx="16" cy="50" r="2" fill="#e0f2fe"/>
  <circle cx="50" cy="88" r="2" fill="#e0f2fe"/>
</svg>