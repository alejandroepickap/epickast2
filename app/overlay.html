<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>EpicKast Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      padding: 6px;
    }
    .hud {
      background: rgba(11, 14, 22, 0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }
    .hud-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
      cursor: grab;
      padding: 2px 4px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 10.5px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .hud-close {
      -webkit-app-region: no-drag;
      cursor: pointer;
      background: transparent;
      border: 0;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .hud-close:hover {
      color: #ff5468;
      background: rgba(255, 84, 104, 0.15);
    }
    .speaker-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 240px;
      overflow-y: auto;
    }
    .speaker {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      transition: all 0.12s ease;
    }
    .speaker.speaking {
      background: rgba(16, 185, 129, 0.16);
      border-color: rgba(16, 185, 129, 0.45);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.25);
    }
    .av {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #334155;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      flex: none;
      position: relative;
    }
    .speaker.speaking .av {
      box-shadow: 0 0 0 2px #10b981;
    }
    .name {
      font-size: 11.5px;
      font-weight: 600;
      color: #e2e8f0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .speaker.speaking .name {
      color: #34d399;
    }
    .speaker.muted .name::after {
      content: " 🔇";
      font-size: 9.5px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-head">
      <span>🎮 EpicKast Overlay</span>
      <button id="closeBtn" class="hud-close" title="Cerrar overlay">✕</button>
    </div>
    <div id="speakers" class="speaker-list">
      <div style="font-size:11px;color:#94a3b8;padding:4px;text-align:center">En espera de llamada...</div>
    </div>
  </div>

  <script>
    const speakersEl = document.getElementById('speakers');
    document.getElementById('closeBtn').onclick = () => {
      window.epic?.toggleOverlay(false);
    };

    if (window.epic?.onOverlayData) {
      window.epic.onOverlayData((data) => {
        if (!data || !data.peers || data.peers.length === 0) {
          speakersEl.innerHTML = '<div style="font-size:11px;color:#94a3b8;padding:4px;text-align:center">Sin llamada activa</div>';
          return;
        }
        speakersEl.innerHTML = '';
        data.peers.forEach((p) => {
          const row = document.createElement('div');
          row.className = 'speaker' + (p.speaking ? ' speaking' : '') + (p.muted ? ' muted' : '');
          
          const av = document.createElement('div');
          av.className = 'av';
          if (p.color) av.style.background = p.color;
          av.textContent = (p.name || '?')[0].toUpperCase();

          const nm = document.createElement('div');
          nm.className = 'name';
          nm.textContent = p.name;

          row.appendChild(av);
          row.appendChild(nm);
          speakersEl.appendChild(row);
        });
      });
    }
  </script>
</body>
</html>
